services:
  db:
    image: postgres:16-alpine
    container_name: powr_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-powr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-powr_password}
      POSTGRES_DB: ${POSTGRES_DB:-powr_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: powr_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-powr_user}:${POSTGRES_PASSWORD:-powr_password}@db:5432/${POSTGRES_DB:-powr_dev}
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: powr_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
