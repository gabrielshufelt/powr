version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: powr_db
    restart: always
    environment:
      POSTGRES_USER: powr_user
      POSTGRES_PASSWORD: powr_password
      POSTGRES_DB: powr_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: powr_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://powr_user:powr_password@db:5432/powr_dev
    volumes:
      - ./backend:/app
    depends_on:
      - db

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: powr_frontend
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./frontend:/app

volumes:
  postgres_data:
