# Source-File AI Declaration
# AI contribution: 50% or more AI-generated
name: ci

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO: re-enable once frontend/ exists
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: ${{ env.NODE_VERSION }}
      #     cache: npm
      #     cache-dependency-path: frontend/package-lock.json

      # TODO: re-enable once frontend/ exists
      # - name: Install frontend dependencies
      #   working-directory: frontend
      #   run: npm ci

      # TODO: re-enable once frontend/ exists
      # - name: Lint frontend (ESLint)
      #   working-directory: frontend
      #   run: npm run lint

      # - name: Typecheck frontend
      #   working-directory: frontend
      #   run: npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Ruff and mypy versions are pinned in backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint backend (Ruff)
        working-directory: backend
        run: ruff check .

      - name: Check backend formatting (Ruff)
        working-directory: backend
        run: ruff format --check .

      - name: Type check backend (mypy)
        working-directory: backend
        run: mypy

      - name: Check Source-File AI Declarations
        run: python scripts/check_headers.py

  # TODO: re-enable once frontend/ exists
  # frontend-tests:
  #   name: frontend-tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: npm
  #         cache-dependency-path: frontend/package-lock.json
  #
  #     - name: Install dependencies
  #       working-directory: frontend
  #       run: npm ci
  #
  #     - name: Run unit tests
  #       working-directory: frontend
  #       run: npm test -- --run

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: powr
          POSTGRES_PASSWORD: powr
          POSTGRES_DB: powr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U powr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://powr:powr@localhost:5432/powr_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run unit and integration tests
        working-directory: backend
        run: pytest
