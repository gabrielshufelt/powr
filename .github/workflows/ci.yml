name: ci

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO: re-enable once frontend/ exists
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: ${{ env.NODE_VERSION }}
      #     cache: npm
      #     cache-dependency-path: frontend/package-lock.json

      # TODO: re-enable once frontend/ exists
      # - name: Install frontend dependencies
      #   working-directory: frontend
      #   run: npm ci

      # TODO: re-enable once frontend/ exists
      # - name: Lint frontend (ESLint)
      #   working-directory: frontend
      #   run: npm run lint

      # - name: Typecheck frontend
      #   working-directory: frontend
      #   run: npx tsc --noEmit

      # Ruff version is pinned in backend/requirements.txt
      - name: Lint backend (Ruff)
        uses: astral-sh/ruff-action@v3
        with:
          src: backend
          version-file: backend/requirements.txt
          args: check --target-version py312

      - name: Check backend formatting (Ruff)
        working-directory: backend
        run: ruff format --check --target-version py312 .

