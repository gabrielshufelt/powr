name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: powr
          POSTGRES_PASSWORD: powr
          POSTGRES_DB: powr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U powr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The tests do not use the "powr" database itself: backend/tests/e2e_server.py reads this URL
    # to find the server, then creates a fresh "powr_e2e" database on it for the test backend.
    env:
      DATABASE_URL: postgresql://powr:powr@localhost:5432/powr
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      run: npm ci
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    - name: Install backend dependencies
      working-directory: backend
      run: pip install -r requirements.txt
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
